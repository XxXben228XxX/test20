services:
  - type: web
    name: test20-app  # Назва твого веб-сервісу на Render
    env: java
    region: eu-central-1 # Оберіть бажаний регіон (наприклад, eu-central-1, us-east-1)
    buildCommand: "./mvnw clean install -DskipTests" # Команда для збірки твого Maven проєкту
    startCommand: "java -jar target/demo7-0.0.1-SNAPSHOT.jar" # Команда для запуску JAR файлу
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: test20-db # Назва бази даних PostgreSQL на Render (створимо її окремо)
          property: connectionString
      - key: SPRING_PROFILES_ACTIVE
        value: postgres # Якщо ти використовуєш профіль 'postgres'
      - key: JAVA_TOOL_OPTIONS
        value: "-Dserver.port=10000" # Задаємо порт, який слухатиме Render (може бути будь-який доступний)